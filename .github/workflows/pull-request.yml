name: Test and pre-release to npm

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) for [publish] pre-releases
    uses: jabranr/workflows/.github/workflows/reusable-pr-checks.yml@59972e7319b1eb97d518e166633be1acddaf05db # main @ 2026-11-24
    with:
      use-lerna: false
      run-lint: false

  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-24.04 # Playwright 1.54 has no build for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: 'npm'
      - run: npm ci
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: CI=true npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
